<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고객 상담 및 문의</title>
</head>
<body>
    <h1>고객 상담 및 문의</h1>

    <form id="customerForm">
        <p>
            <label for="customerName">고객 이름 입력창:</label>
            <input type="text" id="customerName" name="customerName">
        </p>
        <p>
            <label for="contactEmail">이메일 입력창:</label>
            <input type="email" id="contactEmail" name="contactEmail">
        </p>
        <p>
            <label for="inquiryType">문의 유형:</label>
            <select id="inquiryType" name="inquiryType">
                <option value="일반문의">일반문의</option>
                <option value="제휴문의">제휴문의</option>
                <option value="기타">기타</option>
            </select>
        </p>
        <p>
            <label for="inquiryContent">문의 내용:</label><br>
            <textarea id="inquiryContent" name="inquiryContent" rows="5" cols="40"></textarea>
        </p>
        <p>
            <button type="submit">문의하기</button>
        </p>
    </form>

        <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            let name = document.getElementById('customerName').value.trim();
            let email = document.getElementById('contactEmail').value.trim();

            if (name === '') {
                e.preventDefault();
                alert('고객 이름을 입력해야 합니다.');
            }
            else if (email === '') {
                e.preventDefault();
                alert('이메일을 입력해야 합니다.');
            } else {
                alert('문의가 성공적으로 접수되었습니다.');
            }
        });
    </script>
</body>
</html>
