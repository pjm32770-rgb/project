<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제공 서비스 목록</title>
    <style>
        body {
            background-color: #dbe1e0;
            font-family: 'Arial', sans-serif;
            margin: 30px;
        }
        h1 {
            color: #001078;
            text-align: center;
        }
        .service {
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>핵심 서비스 안내</h1>

    <div class="service">
        <h2>1. 1:1 맞춤형 멘토링</h2>
        <p>전문 멘토와의 1:1 상담을 통해 개인 맞춤형 학습 전략을 세우실 수 있습니다.</p>
    </div>

    <div class="service">
        <h2>2. 실무 프로젝트 캠프</h2>
        <p>실제 프로젝트를 통해 실무 능력을 키울 수 있는 기회입니다.</p>
    </div>

    <div class="service">
        <h2>3. 취업 컨설팅 및 매칭</h2>
        <p>취업을 위한 전문적인 컨설팅과 적절한 기업 매칭 서비스를 제공합니다.</p>
    </div>
</body>
</html>
