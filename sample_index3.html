<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 신청 및 문의</title>
</head>
<body>
    <h1>희망 도서 신청</h1>

    <form>
        <p>
            <label for="applicant">신청자명:</label>
            <input type="text" id="applicant" name="applicant" required>
        </p>
        <p>
            <label for="contactEmail">이메일:</label>
            <input type="email" id="contactEmail" name="contactEmail" required>
        </p>
        <p>
            <label for="bookGenre">도서 장르:</label>
            <select id="bookGenre" name="bookGenre">
                <option value="소설">소설</option>
                <option value="IT/컴퓨터">IT/컴퓨터</option>
                <option value="인문">인문</option>
            </select>
        </p>
        <p>
            <label for="bookTitle">신청 책 제목 및 사유:</label><br>
            <textarea id="bookTitle" name="bookTitle" rows="5" cols="40"></textarea>
        </p>
        <p>
            <button type="submit">신청하기</button>
        </p>
    </form>
</body>
</html>
